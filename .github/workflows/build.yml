name: Build Soterian Clock

# Tag a release like `v2.1.0` to trigger a matrix build that publishes
# Linux + macOS + Windows archives to a GitHub Release. workflow_dispatch
# also available for manual builds during development.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.0.3)'
        required: true
        default: '2.0.3'

permissions:
  contents: write

jobs:
  test:
    # Linux-only unit tests for the parts that don't need a Tk display.
    # Gates the matrix build — a tag push that fails tests doesn't ship a
    # GitHub Release.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Run pytest
        run: python -m pytest tests/ -v

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            artifact: soterian-clock
          - os: windows-latest
            platform: windows
            arch: x64
            artifact: soterian-clock.exe
          - os: macos-latest
            platform: macos
            arch: arm64
            artifact: soterian-clock

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install Linux GUI deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgirepository1.0-dev gir1.2-ayatanaappindicator3-0.1

      - name: Build with PyInstaller
        run: python -m PyInstaller installer/soterian_clock.spec --noconfirm --clean

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Extract from tag: v2.0.3 -> 2.0.3
            TAG="${{ github.ref_name }}"
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Add Linux install script (systemd user unit, not XDG autostart)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cat > dist/soterian-clock/install.sh << 'INSTALLER'
          #!/usr/bin/env bash
          # Soterian Clock — Linux Installer.
          # Wires a systemd user unit instead of XDG autostart so the widget
          # is supervised (Restart=on-failure) and its stderr is captured to
          # journald — the v1 widget died silently for 3 weeks in April 2026
          # because XDG autostart had no supervisor and no log capture.
          set -euo pipefail

          INSTALL_DIR="$HOME/.local/share/soterian-clock"
          BIN_LINK="$HOME/.local/bin/soterian-clock"
          SYSTEMD_USER_DIR="$HOME/.config/systemd/user"
          OLD_AUTOSTART="$HOME/.config/autostart/soterian-clock.desktop"
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"

          echo "Installing Soterian Clock..."

          mkdir -p "$INSTALL_DIR"
          cp -r "$SCRIPT_DIR"/* "$INSTALL_DIR/"
          chmod +x "$INSTALL_DIR/soterian-clock"
          rm -f "$INSTALL_DIR/install.sh"

          mkdir -p "$(dirname "$BIN_LINK")"
          ln -sf "$INSTALL_DIR/soterian-clock" "$BIN_LINK"

          mkdir -p "$SYSTEMD_USER_DIR"
          cat > "$SYSTEMD_USER_DIR/soterian-clock.service" << EOF
          [Unit]
          Description=Soterian Floating Clock Widget
          PartOf=graphical-session.target
          After=graphical-session.target

          [Service]
          Type=simple
          ExecStart=$INSTALL_DIR/soterian-clock
          Restart=on-failure
          RestartSec=30
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=soterian-clock

          [Install]
          WantedBy=graphical-session.target
          EOF

          # Daily diagnostic — runs `soterian-clock --diagnostic` once per day.
          # Failures show up as a `failed` systemd user unit; combined with the
          # widget's own startup self-test, surfaces silent degradation within
          # ~24h instead of waiting for visual notice.
          cat > "$SYSTEMD_USER_DIR/soterian-clock-diagnostic.service" << EOF
          [Unit]
          Description=Soterian Clock daily self-check

          [Service]
          Type=oneshot
          ExecStart=$INSTALL_DIR/soterian-clock --diagnostic
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=soterian-clock-diagnostic
          EOF

          cat > "$SYSTEMD_USER_DIR/soterian-clock-diagnostic.timer" << EOF
          [Unit]
          Description=Run Soterian Clock --diagnostic daily

          [Timer]
          OnCalendar=daily
          Persistent=true
          RandomizedDelaySec=30min
          Unit=soterian-clock-diagnostic.service

          [Install]
          WantedBy=timers.target
          EOF

          if [ -f "$OLD_AUTOSTART" ]; then
            mv "$OLD_AUTOSTART" "$OLD_AUTOSTART.bak"
            echo "Retired old XDG autostart: $OLD_AUTOSTART -> ${OLD_AUTOSTART}.bak"
          fi

          systemctl --user daemon-reload
          systemctl --user enable --now soterian-clock.service
          systemctl --user enable --now soterian-clock-diagnostic.timer

          echo ""
          echo "Installed to:  $INSTALL_DIR"
          echo "Symlink:       $BIN_LINK"
          echo "Systemd unit:  $SYSTEMD_USER_DIR/soterian-clock.service"
          echo ""
          echo "The widget is running and will start automatically on each login."
          echo "  Status:    systemctl --user status soterian-clock"
          echo "  Logs:      journalctl --user -u soterian-clock -f"
          echo "  Stop:      systemctl --user disable --now soterian-clock"
          echo "  Uninstall: bash $INSTALL_DIR/uninstall.sh"
          INSTALLER
          chmod +x dist/soterian-clock/install.sh

      - name: Add Linux uninstall script
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          cat > dist/soterian-clock/uninstall.sh << 'UNINSTALLER'
          #!/usr/bin/env bash
          # Soterian Clock — Linux Uninstaller. Idempotent.
          set -euo pipefail
          INSTALL_DIR="$HOME/.local/share/soterian-clock"
          BIN_LINK="$HOME/.local/bin/soterian-clock"
          UNIT="$HOME/.config/systemd/user/soterian-clock.service"
          SETTINGS_DIR="$HOME/.config/soterian-clock"
          echo "Uninstalling Soterian Clock..."
          if systemctl --user list-unit-files 2>/dev/null | grep -q "^soterian-clock.service"; then
              systemctl --user disable --now soterian-clock.service 2>/dev/null || true
          fi
          if [ -f "$UNIT" ]; then
              rm -f "$UNIT"
              systemctl --user daemon-reload 2>/dev/null || true
              echo "  Removed systemd unit:  $UNIT"
          fi
          if [ -d "$INSTALL_DIR" ]; then
              rm -rf "$INSTALL_DIR"
              echo "  Removed install dir:  $INSTALL_DIR"
          fi
          if [ -L "$BIN_LINK" ]; then
              rm -f "$BIN_LINK"
              echo "  Removed symlink:      $BIN_LINK"
          fi
          # Remove keyring entry — try secret-tool first, fall back to python keyring.
          KEYRING_REMOVED="no"
          if command -v secret-tool >/dev/null 2>&1; then
              if secret-tool clear service soterian-clock username widget-token 2>/dev/null; then
                  KEYRING_REMOVED="yes"
                  echo "  Removed keyring entry"
              fi
          fi
          if [ "$KEYRING_REMOVED" = "no" ] && command -v python3 >/dev/null 2>&1; then
              python3 -c "
          try:
              import keyring
              keyring.delete_password('soterian-clock', 'widget-token')
              print('  Removed keyring entry')
          except Exception:
              pass
          " 2>/dev/null || true
          fi
          if [ -d "$SETTINGS_DIR" ]; then
              echo ""
              read -r -p "Also remove $SETTINGS_DIR (member metadata + window position)? [y/N] " ans
              if [ "${ans:-n}" = "y" ] || [ "${ans:-n}" = "Y" ]; then
                  rm -rf "$SETTINGS_DIR"
                  echo "  Removed settings dir"
              fi
          fi
          echo ""
          echo "Done."
          UNINSTALLER
          chmod +x dist/soterian-clock/uninstall.sh

      - name: Package (Linux)
        if: matrix.platform == 'linux'
        run: |
          chmod -R a+rX dist/soterian-clock/
          chmod a+x dist/soterian-clock/soterian-clock
          tar --owner=0 --group=0 -czf \
            "dist/soterian-clock-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz" \
            -C dist soterian-clock

      # ============================================================
      # Code signing — scaffolded but inert until certs are provisioned.
      # ============================================================
      # macOS Gatekeeper and Windows SmartScreen reject unsigned binaries
      # with scary warnings. The release tarballs run anyway (members can
      # right-click → Open on macOS, click "More info → Run anyway" on
      # Windows), but signing removes that friction.
      #
      # To enable signing later, add these repository secrets:
      #
      #   APPLE_DEVELOPER_ID         "Developer ID Application: ..."  identity
      #   APPLE_SIGNING_CERT_BASE64  base64 of the .p12 cert+key
      #   APPLE_SIGNING_CERT_PWD     password for the .p12
      #   APPLE_NOTARIZE_USER        Apple ID email
      #   APPLE_NOTARIZE_PWD         App-specific password
      #   APPLE_NOTARIZE_TEAM        Team ID (10-char Apple Developer)
      #
      #   WINDOWS_CERT_BASE64        base64 of the EV code-signing cert (.pfx)
      #   WINDOWS_CERT_PWD           password for the .pfx
      #
      # Cost: Apple Developer Program $99/yr; Windows EV cert $300+/yr.
      # The steps below detect missing secrets and no-op cleanly so the
      # build keeps succeeding for unsigned releases.

      - name: Sign macOS binary (skipped if no cert)
        if: matrix.platform == 'macos'
        env:
          APPLE_SIGNING_CERT_BASE64: ${{ secrets.APPLE_SIGNING_CERT_BASE64 }}
          APPLE_SIGNING_CERT_PWD: ${{ secrets.APPLE_SIGNING_CERT_PWD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          if [ -z "$APPLE_SIGNING_CERT_BASE64" ] || [ -z "$APPLE_DEVELOPER_ID" ]; then
            echo "::notice::macOS signing skipped — no APPLE_SIGNING_CERT_BASE64/APPLE_DEVELOPER_ID configured. Release will be unsigned (Gatekeeper warning on user side)."
            exit 0
          fi
          # Import cert into a temporary keychain
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PWD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo "$APPLE_SIGNING_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_SIGNING_CERT_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          # Sign every Mach-O inside the bundle (PyInstaller bundles a lot
          # of dylibs alongside the main binary; all need to be signed for
          # the bundle to load post-Gatekeeper).
          find dist/soterian-clock -type f \
               \( -name "*.dylib" -o -name "*.so" -o -perm -u=x \) \
               -exec codesign --force --options runtime \
                              --sign "$APPLE_DEVELOPER_ID" --timestamp {} + 2>&1 | tail -5 || true
          codesign --verify --verbose dist/soterian-clock/soterian-clock || true

      - name: Notarize macOS bundle (skipped if no creds)
        if: matrix.platform == 'macos'
        env:
          APPLE_NOTARIZE_USER: ${{ secrets.APPLE_NOTARIZE_USER }}
          APPLE_NOTARIZE_PWD: ${{ secrets.APPLE_NOTARIZE_PWD }}
          APPLE_NOTARIZE_TEAM: ${{ secrets.APPLE_NOTARIZE_TEAM }}
        run: |
          if [ -z "$APPLE_NOTARIZE_USER" ] || [ -z "$APPLE_NOTARIZE_TEAM" ]; then
            echo "::notice::macOS notarization skipped — no APPLE_NOTARIZE_* configured."
            exit 0
          fi
          ZIP="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/soterian-clock "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --apple-id "$APPLE_NOTARIZE_USER" \
            --password "$APPLE_NOTARIZE_PWD" \
            --team-id "$APPLE_NOTARIZE_TEAM" \
            --wait
          xcrun stapler staple dist/soterian-clock/soterian-clock || true

      - name: Sign Windows binary (skipped if no cert)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PWD: ${{ secrets.WINDOWS_CERT_PWD }}
        run: |
          if (-not $env:WINDOWS_CERT_BASE64 -or -not $env:WINDOWS_CERT_PWD) {
            Write-Host "::notice::Windows signing skipped — no WINDOWS_CERT_BASE64/WINDOWS_CERT_PWD configured. Release will be unsigned (SmartScreen warning on user side)."
            exit 0
          }
          $certPath = "$env:RUNNER_TEMP\cert.pfx"
          [System.IO.File]::WriteAllBytes($certPath,
            [System.Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          if (-not (Test-Path $signtool)) {
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                         Sort-Object FullName -Descending | Select-Object -First 1).FullName
          }
          # Sign the main exe; PyInstaller doesn't typically generate signed
          # auxiliary DLLs that need re-signing for SmartScreen reputation.
          & $signtool sign /f $certPath /p $env:WINDOWS_CERT_PWD /fd sha256 `
            /tr "http://timestamp.digicert.com" /td sha256 `
            "dist\soterian-clock\soterian-clock.exe"
          & $signtool verify /pa "dist\soterian-clock\soterian-clock.exe"

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\soterian-clock -DestinationPath `
            "dist\soterian-clock-${{ steps.version.outputs.version }}-windows-x64.zip"

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd dist && zip -r \
            "soterian-clock-${{ steps.version.outputs.version }}-macos-arm64.zip" \
            soterian-clock

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: soterian-clock-${{ matrix.platform }}
          path: |
            dist/soterian-clock-*.tar.gz
            dist/soterian-clock-*.zip
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate SHA256SUMS
        # Standard `sha256sum` output: "<64-hex>  <filename>". The widget
        # auto-update flow fetches this file, finds the line matching its
        # platform tarball, and verifies the download before extraction.
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Soterian Clock ${{ github.ref_name }}"
          body: |
            ## Soterian Clock ${{ github.ref_name }}

            Cross-platform desktop widget for the Petrachora Soteria calendar.

            ### Install

            **Linux:**
            ```bash
            tar -xzf soterian-clock-*-linux-x86_64.tar.gz
            cd soterian-clock
            ./install.sh
            ```
            Wires a systemd user unit (Restart=on-failure + journal capture).

            **Windows:** Extract the zip and run `soterian-clock.exe`.

            **macOS:** Extract the zip and move `soterian-clock` to `/Applications`.

            ### Changelog

            See [CHANGELOG.md](https://github.com/SoteriaCovenantTrust/soterian-clock/blob/main/CHANGELOG.md).
          files: |
            artifacts/**/*
            artifacts/SHA256SUMS
          draft: false
          prerelease: false
